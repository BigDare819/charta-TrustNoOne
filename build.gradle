plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// The language files and the javadoc both carry non-ASCII text authored in UTF-8, so javac and the
// resource copier are pinned to UTF-8 rather than falling back to the platform default charset.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing,-this-escape']
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
}

repositories {
    // Charta is installed here by `gradlew publishToMavenLocal` in the charta checkout.
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = "Shedaniel's Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "dev.lucaargolo:charta-fabric-${minecraft_version}:${charta_version}"
}

loom {
    runs {
        client {
            client()
            setConfigName('Avalon Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs('--quickPlaySingleplayer', 'New')
            // Windowed size for the dev client. Matches the author's real 1080p setup minus the window
            // decorations, so a frame built here lines up with a screenshot taken there.
            programArgs('--width', '1920', '--height', '1040')
        }
        server {
            server()
            setConfigName('Avalon Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

processResources {
    var expandProps = ['version'                 : version,
                       'group'                   : project.group,
                       'minecraft_version'       : minecraft_version,
                       'minecraft_version_range' : minecraft_version_range,
                       'fabric_version'          : fabric_version,
                       'fabric_loader_version'   : fabric_loader_version,
                       'charta_version'          : charta_version,
                       'charta_version_range'    : charta_version_range,
                       'mod_id'                  : mod_id,
                       'mod_name'                : mod_name,
                       'mod_author'              : mod_author,
                       'mod_repo'                : mod_repo,
                       'license'                 : license,
                       'description'             : project.description,
                       'java_version'            : java_version]

    filesMatching(['fabric.mod.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

// Atomic swap (stage next to the target, then rename into place): ZipFile caches
// the central directory when it opens a jar, so rewriting the bytes under a
// live loader leaves every later class read with
// "ZipException: invalid LOC header (bad signature)".
//
// Windows will not rename over a file another process holds open, and a running
// Minecraft holds every mod jar open for its whole life. Since the game has to be
// restarted to load new code anyway, fall back to writing the bytes in place
// (which Windows does allow) and say so.
tasks.register('deploy') {
    group = 'myavalon'
    description = 'Builds the mod and swaps it into the PCL2 1.21.1-Fabric instance.'
    dependsOn tasks.named('build')

    def instanceMods = providers.gradleProperty('pcl2ModsDir')
            .orElse('D:/PCL2/.minecraft/versions/1.21.1-Fabric 0.19.5/mods')
            .get()

    doLast {
        def src = tasks.named('remapJar').get().archiveFile.get().asFile
        def dir = new File(instanceMods)
        dir.mkdirs()
        def dst = new File(dir, src.name)
        def staged = new File(dir, src.name + '.staged')
        java.nio.file.Files.copy(src.toPath(), staged.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        try {
            java.nio.file.Files.move(staged.toPath(), dst.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                    java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
            java.nio.file.Files.move(staged.toPath(), dst.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } catch (java.io.IOException e) {
            // The game holds the jar open. Windows then refuses both the rename and the
            // delete-then-create that Files.copy(REPLACE_EXISTING) performs internally, but it
            // does allow truncating the *existing* file handle. So copy stream-to-stream.
            logger.warn("Could not rename ${dst.name} (${e.class.simpleName}: ${e.message})")
            logger.warn("The game is probably running and holding the jar open; writing it in place instead.")
            logger.warn("That is safe on disk, but restart the game to be sure of loading this build.")
            try (java.io.InputStream in = java.nio.file.Files.newInputStream(staged.toPath());
                 java.io.OutputStream out = java.nio.file.Files.newOutputStream(dst.toPath(),
                         java.nio.file.StandardOpenOption.WRITE,
                         java.nio.file.StandardOpenOption.TRUNCATE_EXISTING)) {
                in.transferTo(out)
            }
            java.nio.file.Files.deleteIfExists(staged.toPath())
        }
        logger.lifecycle("Deployed ${src.name} to ${dir}")
        fileTree(instanceMods).matching { include "${mod_id}-fabric-*.jar" }.each { f ->
            if (f.name != dst.name) {
                logger.lifecycle("Removing stale ${f.name}")
                f.delete()
            }
        }
    }
}
